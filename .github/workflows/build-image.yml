name: build-image

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'site/**', '.github/workflows/site.yml']
  pull_request:
    paths-ignore: ['**.md', 'site/**']
  schedule:
    - cron: '30 5 * * *'   # daily: pick up Fedora base image security updates
  workflow_dispatch:

env:
  FEDORA_VERSION: '45'
  IMAGE_NAME: omadora
  # The image's name before the rename. Installs from then still pull it until
  # omadora-rename-image.service moves them; drop this once they all have.
  OLD_IMAGE_NAME: fedcandor
  REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # Actions are pinned to commit SHAs (tags can be moved).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Metadata
        id: meta
        run: |
          stamp=$(date -u +%Y%m%d)
          echo "version=${FEDORA_VERSION}.${stamp}.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "tags=latest ${FEDORA_VERSION} ${FEDORA_VERSION}-${stamp}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY,,}" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          containerfiles: ./atomic/Containerfile
          context: .
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            FEDORA_VERSION=${{ env.FEDORA_VERSION }}
            IMAGE_REF=${{ steps.meta.outputs.registry }}/${{ env.IMAGE_NAME }}
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
          oci: false

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        id: push
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ steps.meta.outputs.registry }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.registry }}/${{ env.IMAGE_NAME }}
        run: |
          if [ -z "${COSIGN_PRIVATE_KEY}" ]; then
            echo "::warning::COSIGN_PRIVATE_KEY not set: image pushed UNSIGNED (see atomic/README.md)"
            exit 0
          fi
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"

      - name: Publish under the old name
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REGISTRY_LC: ${{ steps.meta.outputs.registry }}
          TAGS: ${{ steps.meta.outputs.tags }}
          CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in ${TAGS}; do
            skopeo copy --all --preserve-digests --src-creds "${CREDS}" --dest-creds "${CREDS}" \
              "docker://${REGISTRY_LC}/${IMAGE_NAME}@${DIGEST}" \
              "docker://${REGISTRY_LC}/${OLD_IMAGE_NAME}:${tag}"
          done
