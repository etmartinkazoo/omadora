  <circle cx="44" cy="20" r="11" fill="url(#fc-glow)"/>
  <path d="M44 11.5 C44.9 17.6 46.4 19.1 52.5 20 C46.4 20.9 44.9 22.4 44 28.5 C43.1 22.4 41.6 20.9 35.5 20 C41.6 19.1 43.1 17.6 44 11.5 Z" fill="#f4f8ff"/>
</svg>
