<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="omadora">
  <defs>
    <linearGradient id="fc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2a45"/>
      <stop offset="1" stop-color="#0a101b"/>
    </linearGradient>
    <linearGradient id="fc-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a64a8"/>
      <stop offset="1" stop-color="#1f3d6e"/>
    </linearGradient>
    <radialGradient id="fc-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bcd4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#bcd4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#fc-bg)"/>
  <!-- sway tiling: one tall window, two stacked -->
