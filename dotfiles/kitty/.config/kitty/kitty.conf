# omadora kitty configuration. Colors come from the active omadora theme
# (theme.conf is generated by omadora-theme and reloaded live).
# Personal tweaks: ~/.config/kitty/local.conf (not tracked; included last).

font_family          0xProto Nerd Font
font_size            10.5
window_padding_width 8
cursor_blink_interval 0
enable_audio_bell    no
confirm_os_window_close 0
remember_window_size no
initial_window_width  100c
initial_window_height 30c
shell_integration    enabled
update_check_interval 0

include theme.conf
globinclude local.conf
